<!doctype html>
<html lang="zh-HK">
  <head>
    <script>
      // Prevent flash of wrong theme (FOUC)
      (function(){
        var t = localStorage.getItem('hk_theme') || 'dark';
        if (t === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>頭盔王 零售管理平台</title>
    <meta name="description" content="頭盔王零售管理平台 — 內部營運 dashboard" />
    <!-- favicon:由 client/public/hk-logo.jpg 生成(裁走原圖多餘白邊,再擺入
         白底方形 canvas 留 8% margin)。老闆 2026-09-18 指定要留白底 —— 唔好
         轉透明:白底喺深色 tab bar 上似張卡,個藍色盾牌反而更加標青。
         舊版 index.html 一直指緊 /favicon.png 但個檔案從來冇存在過 →
         瀏覽器一直 fallback 去預設地球 icon。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
