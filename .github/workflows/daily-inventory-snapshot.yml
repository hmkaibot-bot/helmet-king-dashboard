name: Daily Inventory Snapshot

# 每天從 Shopify (REST) + BC (OData) 抓 inventory snapshot
# 補齊 n8n 沒有處理的 shopify_inventory / bc_inventory 兩張表

on:
  schedule:
    # 每天 HKT 凌晨 02:30 = UTC 18:30（前一天）
    # 跟 Shopify backfill (02:00) 同一個 2am batch。
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      sync_shopify:
        description: "Run Shopify sync (1/0)"
        required: false
        default: "1"
      sync_bc:
        description: "Run BC sync (1/0)"
        required: false
        default: "1"
      sync_bc_purchase_invoices:
        description: "Run BC purchase invoices sync (1/0)"
        required: false
        default: "1"
      bc_pi_full_backfill:
        description: "BC PI: full backfill, no $filter (1/0)"
        required: false
        default: "0"
      bc_pi_lookback_days:
        description: "BC PI: incremental lookback days"
        required: false
        default: "7"
      sync_bc_sales_invoices:
        description: "Run BC sales invoices sync (1/0)"
        required: false
        default: "1"
      bc_si_full_backfill:
        description: "BC SI: full backfill, no date filter (1/0)"
        required: false
        default: "0"
      bc_si_lookback_days:
        description: "BC SI: incremental lookback days"
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run inventory snapshot
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          BC_TENANT_ID: ${{ secrets.BC_TENANT_ID }}
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
          BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT }}
          BC_COMPANY_ID: ${{ secrets.BC_COMPANY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SYNC_SHOPIFY: ${{ github.event.inputs.sync_shopify || '1' }}
          SYNC_BC: ${{ github.event.inputs.sync_bc || '1' }}
          SYNC_BC_PURCHASE_INVOICES: ${{ github.event.inputs.sync_bc_purchase_invoices || '1' }}
          BC_PI_FULL_BACKFILL: ${{ github.event.inputs.bc_pi_full_backfill || '0' }}
          BC_PI_LOOKBACK_DAYS: ${{ github.event.inputs.bc_pi_lookback_days || '7' }}
          SYNC_BC_SALES_INVOICES: ${{ github.event.inputs.sync_bc_sales_invoices || '1' }}
          BC_SI_FULL_BACKFILL: ${{ github.event.inputs.bc_si_full_backfill || '0' }}
          BC_SI_LOOKBACK_DAYS: ${{ github.event.inputs.bc_si_lookback_days || '7' }}
        run: python scripts/daily_inventory_snapshot.py
