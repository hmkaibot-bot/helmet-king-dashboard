# 一次性測試:GH Actions 個 SHOPIFY_TOKEN 有冇 read_reports(ShopifyQL)權限。
# 有 → 就可以寫每晚自動更新佣金快照嘅 job;測完會刪走呢個檔。
name: Commission Scope Test
on:
  push:
    branches: [claude/funny-bardeen-t9d3e5]
    paths: ['.github/workflows/commission-scope-test.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try ShopifyQL with sync token
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
        run: |
          resp=$(curl -s -X POST "https://${SHOPIFY_STORE}/admin/api/2026-07/graphql.json" \
            -H "Content-Type: application/json" \
            -H "X-Shopify-Access-Token: ${SHOPIFY_TOKEN}" \
            -d '{"query":"query { shopifyqlQuery(query: \"FROM sales SHOW net_sales SINCE -7d UNTIL today\") { parseErrors tableData { columns { name } rows } } }"}')
          echo "raw (head): $(echo "$resp" | head -c 600)"
          if echo "$resp" | grep -qi "ACCESS_DENIED\|access denied\|Required access"; then
            echo "RESULT: NO_READ_REPORTS"
          elif echo "$resp" | grep -q "tableData"; then
            echo "RESULT: HAS_READ_REPORTS"
          else
            echo "RESULT: UNKNOWN"
          fi
