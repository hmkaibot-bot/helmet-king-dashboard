name: Daily Shopify Backfill

# 備援 n8n workflow — 每天從 Shopify 直接補回最近 7 天的訂單與 line items
# n8n 排程模式經常拿不到 line_items，這個 job 確保資料一定會進到 Supabase。

on:
  schedule:
    # 每天 HKT 凌晨 02:00 = UTC 18:00（前一天）
    # 統一資料更新批次：所有 retail / performance 頁面以此為準
    - cron: "0 18 * * *"
    # 後備補跑：HKT 06:00 = UTC 22:00。upsert 係 idempotent,
    # 02:00 跑成功嘅話呢餐純粹重覆寫一次;跑失敗就喺開舖前冚返。
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "How many days back to backfill"
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run Shopify backfill
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '7' }}
        # 網絡/API 閃失自動重試 3 次,每次隔 2 分鐘
        run: |
          for attempt in 1 2 3; do
            echo "=== attempt ${attempt} ==="
            python scripts/daily_shopify_backfill.py && exit 0
            [ "$attempt" -lt 3 ] && sleep 120
          done
          echo "::error::Shopify backfill failed after 3 attempts"
          exit 1
